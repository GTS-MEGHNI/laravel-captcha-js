name: Bug Report
description: Report something that is not working as expected.
title: '[Bug]: '
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report a bug. Please complete the fields below so we can reproduce the issue quickly.

    - type: input
      id: package-version
      attributes:
          label: Package Version
          description: Provide the `@gts-meghni/laravel-captcha` version that you are using.
          placeholder: 1.0.0
      validations:
          required: true

    - type: input
      id: server-version
      attributes:
          label: Server Version
          description: Provide the `gts-meghni/laravel-captcha` version serving the endpoints, or describe the server if it is not that package.
          placeholder: 1.0.0
      validations:
          required: true

    - type: input
      id: node-version
      attributes:
          label: Node Version
          description: Provide the Node version that you are using.
          placeholder: 20.11.0
      validations:
          required: true

    - type: input
      id: runtime
      attributes:
          label: Runtime And Framework
          description: Where the client runs, and the framework around it if any.
          placeholder: Chrome 131, Next.js 15 app router, React 19
      validations:
          required: false

    - type: textarea
      id: description
      attributes:
          label: Description
          description: Provide a clear description of the issue you are facing.
      validations:
          required: true

    - type: textarea
      id: steps-to-reproduce
      attributes:
          label: Steps To Reproduce
          description: Provide detailed steps to reproduce the issue. A minimal reproduction repository is helpful when possible.
      validations:
          required: true

    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Add any other context that might help diagnose the issue.
      validations:
          required: false
